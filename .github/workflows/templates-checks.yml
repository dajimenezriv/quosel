name: Templates checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["templates/**"]
  pull_request:
    paths: ["templates/**"]

concurrency:
  group: templates-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: templates

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc
      - run: pnpm format
      - run: pnpm lint
