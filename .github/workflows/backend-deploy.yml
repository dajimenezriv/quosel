name: Backend deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/**"]
  # pull_request:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          username: dajimenezriv
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            dajimenezriv/quosel-backend:${{ github.sha }}
            dajimenezriv/quosel-backend:latest

      - name: Trigger Railway redeploy
        run: |
          npm install -g @railway/cli
          railway redeploy --service quosel-backend --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
